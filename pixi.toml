[workspace]
authors = ["D. Kamensky"]
channels = ["conda-forge"]
name = "ShNAPr"
platforms = ["linux-64"]
version = "2019.1"

[tasks]
docs = "sphinx-build -b html docs docs/_build/html"

[dependencies]
# ShNAPr targets the classic tIGAr/FEniCS stack, not dolfinx.
python = "3.8.*"
fenics = "2019.1.*"
mpich = "*"
petsc4py = "*"
numpy = "*"
scipy = "*"
sphinx = "*"
pip = "*"

[pypi-dependencies]
igakit = { url = "https://github.com/dalcinl/igakit/archive/refs/heads/master.zip" }
tigar = { git = "https://github.com/david-kamensky/tIGAr.git", rev = "32c7f0296fb171a5a8dc91ea3120218f85630a19" }
shnapr = { path = ".", editable = true }
# TSFC backend for FFC when parameters["form_compiler"]["representation"] = "tsfc".
# Same Firedrake snapshot tag for all three; newer TSFC expects FIAT.DPC (Firedrake FIAT),
# while conda-forge fenics-fiat 2019.1 does not provide DPC.
tsfc = { git = "https://github.com/firedrakeproject/tsfc.git", rev = "Firedrake_20190307.0" }
finat = { git = "https://github.com/FInAT/FInAT.git", rev = "Firedrake_20190307.0" }
coffee = { git = "https://github.com/coneoproject/COFFEE.git", rev = "Firedrake_20190307.0" }
